[package]
name = "exact-armadillo-run-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
exact-gpu = { path = "../../../../../exact/gpu" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }

[dependencies.sys16]
path = "../../../engines/sys16"

[dependencies.nes-screen]
path = "../../../engines/nes-screen"

[dependencies.nes-ppu]
path = "../../../engines/nes-ppu"

[dependencies.ym2612]
path = "../../../engines/ym2612"
