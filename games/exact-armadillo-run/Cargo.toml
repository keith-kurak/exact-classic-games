# Exact Armadillo Run's native workspace, generated by exact2 from app.json (LLP 1153 D1): never edited, rewritten
# when the manifest's platforms or the checkout change. An app that needs Rust of its own copies this workspace up
# beside app.json and adds its crates there (`bun exact.mjs contract vocab gpu-module`); that one is used instead.
[workspace]
members = ["web", "apple", "gpu"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[patch.crates-io]
accesskit_windows = { path = "../../../../exact/vendor/accesskit-windows" }
taffy = { path = "../../../../exact/vendor/taffy" }
parley = { path = "../../../../exact/vendor/parley" }
fontique = { path = "../../../../exact/vendor/fontique" }
wgpu-hal = { path = "../../../../exact/vendor/wgpu-hal" }
