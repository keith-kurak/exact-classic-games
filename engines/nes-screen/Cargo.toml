[package]
name = "nes-screen"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Shows an nes-ppu frame on an Exact GPU surface: a game implements NesGame (its inputs and its frame), and this uploads the 256x240 picture and draws it at the largest whole-number scale, letterboxed."
build = "build.rs"

[lib]
path = "src/lib.rs"

[dependencies]
exact-gpu = { path = "../../../../exact/gpu" }
nes-ppu = { path = "../nes-ppu" }

[build-dependencies]
exact-gpu-reflect = { path = "../../../../exact/gpu/reflect" }
