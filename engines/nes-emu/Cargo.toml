[package]
name = "nes-emu"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "A basic NES emulator core: the 6502 (official and common unofficial opcodes), the PPU (registers, VRAM, OAM, scanline rendering into nes-ppu's frame), controllers, the APU (through nes-apu) and iNES cartridges with mapper 0 (NROM)."

[lib]
path = "src/lib.rs"

[dependencies]
nes-ppu = { path = "../nes-ppu" }
nes-apu = { path = "../nes-apu" }
